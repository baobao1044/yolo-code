# golangci-lint configuration for yolo-code (File 15 §15.15.1).
# Sprint 0 starts minimal; later sprints add the custom `layered` linter
# (§15.15.2) and stricter presets as the architecture grows.
#
# This file is v2 format. It has to be: the CI job installs
# golangci-lint/v2@latest, and v2 refuses a config without this key rather
# than falling back — "unsupported version of the configuration" was the whole
# of the lint job's output for as long as the two disagreed, so nothing in the
# tree had ever actually been linted in CI.
version: "2"

run:
  go: "1.26"
  # No `timeout` key. v2 removed it and disables the timeout by default; the
  # workflow passes --timeout on the command line instead.

linters:
  # v2's `standard` set is errcheck, govet, ineffassign, staticcheck and
  # unused — the same five the v1 config used to list by hand, so they are no
  # longer named here. Anything below is an addition to that set.
  default: standard
  enable:
    - misspell # spelling
    - revive # style

  settings:
    staticcheck:
      # Everything except the QF ("quickfix") family, which is staticcheck's
      # refactoring-suggestion set rather than its defect set. All five QF hits
      # on this tree argued against code that is deliberate:
      #
      #   QF1001 wants De Morgan's law applied to `!(c == '*' && next == '/')`
      #          in the block-comment scanner, turning "not the end marker" into
      #          two negated halves the reader has to recombine.
      #   QF1003 wants a tagged switch in place of a single `if td.Status ==
      #          Done`, which is one branch.
      #   QF1008 wants `s.shadowSnap.restore` shortened to `s.restore` — inside
      #          a method named `Restore`, where the qualifier is what keeps the
      #          unexported callee distinct from the exported caller one typo
      #          away from infinite recursion.
      #
      # SA (correctness), S (simplification) and ST (style) all stay on; two SA
      # findings in this same pass were real and are fixed.
      checks: ["all", "-QF1001", "-QF1002", "-QF1003", "-QF1008"]

    revive:
      # revive's default rule set is enabled wholesale when `rules` is empty,
      # and on this tree that produced 245 findings, 211 of which were
      # doc-comment *formatting* on symbols that are already documented: the
      # `exported` rule wants a godoc sentence on all ~160 boilerplate
      # Type()/CausalID() methods in internal/event and Name()/Run()/Schema()
      # on every tool, and `package-comments` wants the blank line removed
      # between each package's prose header and its `package` clause.
      #
      # Enumerating the rules instead is a deliberate line: the lint gate
      # should fail on code that is wrong, not on code that is unfashionable.
      # Everything listed below can be traced to a defect it would have caught.
      # The formatting rules are not lost, only unenforced — `go doc` renders
      # this tree fine today, and a later sprint can turn `exported` on as its
      # own change rather than smuggling 211 edits through a CI fix.
      rules:
        - name: blank-imports
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
        - name: var-declaration
        - name: waitgroup-by-value

  exclusions:
    rules:
      # Test helpers frequently close buses in defer and tolerate the error.
      # Production code keeps the default strictness.
      - path: _test\.go
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
